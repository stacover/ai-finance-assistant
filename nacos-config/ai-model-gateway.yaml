# ai-model-gateway config (DataId: ai-model-gateway.yaml, Group: DEFAULT_GROUP)
# Priority is higher than local application.yaml
spring:
  ai:
    openai:
      # DeepSeek API Key (replace with your real key)
      api-key: ${DEEPSEEK_API_KEY:sk-xxxxx}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_finance_assistant?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    # MySQL password (replace with your real password)
    password: ${MYSQL_PASSWORD:root}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
