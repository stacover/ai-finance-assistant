<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 金融助手</title>
    <style>
        :root {
            --primary: #1677ff;
            --primary-hover: #4096ff;
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --border: #e8e8e8;
            --text: #333333;
            --text-secondary: #999999;
            --user-bubble: #1677ff;
            --ai-bubble: #f0f0f0;
            --danger: #ff4d4f;
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            height: 100vh;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
        }

        /* 顶部栏 */
        .header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .header .logo {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
        }

        .header .title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
        }

        .header .subtitle {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .header .status {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #52c41a;
        }

        .header .status .dot {
            width: 8px;
            height: 8px;
            background: #52c41a;
            border-radius: 50%;
        }

        /* 对话区域 */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-area::-webkit-scrollbar {
            width: 6px;
        }

        .chat-area::-webkit-scrollbar-thumb {
            background: #d9d9d9;
            border-radius: 3px;
        }

        /* 欢迎消息 */
        .welcome {
            text-align: center;
            padding: 40px 20px;
        }

        .welcome .icon {
            font-size: 56px;
            margin-bottom: 16px;
        }

        .welcome h2 {
            font-size: 22px;
            color: var(--text);
            margin-bottom: 8px;
        }

        .welcome p {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
        }

        .welcome .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 20px;
        }

        .welcome .suggestion {
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            background: #fff;
        }

        .welcome .suggestion:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* 消息气泡 */
        .message {
            display: flex;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
            font-weight: 600;
        }

        .message.user .avatar {
            background: var(--primary);
            color: #fff;
        }

        .message.ai .avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }

        .message .bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 14px;
            line-height: 1.7;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .message.user .bubble {
            background: var(--user-bubble);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.ai .bubble {
            background: var(--ai-bubble);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }

        .message .time {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
            padding: 0 4px;
        }

        .message.user .time {
            text-align: right;
        }

        /* Markdown 样式（AI 消息内） */
        .message.ai .bubble code {
            background: #e6e6e6;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }

        .message.ai .bubble pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
            font-size: 13px;
        }

        .message.ai .bubble pre code {
            background: none;
            padding: 0;
            color: inherit;
        }

        /* 打字动画 */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 4px 0;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }

        /* 输入区域 */
        .input-area {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: flex-end;
            flex-shrink: 0;
        }

        .input-area textarea {
            flex: 1;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 14px;
            font-size: 14px;
            resize: none;
            outline: none;
            font-family: inherit;
            line-height: 1.5;
            max-height: 120px;
            transition: border-color 0.2s;
        }

        .input-area textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.1);
        }

        .input-area .send-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .input-area .send-btn:hover {
            background: var(--primary-hover);
            transform: scale(1.05);
        }

        .input-area .send-btn:active {
            transform: scale(0.95);
        }

        .input-area .send-btn:disabled {
            background: #d9d9d9;
            cursor: not-allowed;
            transform: none;
        }

        /* 错误提示 */
        .error-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--danger);
            color: #fff;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 1000;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                transform: translateX(-50%) translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        @media (max-width: 600px) {
            .container {
                max-width: 100%;
                border-radius: 0;
            }

            .chat-area {
                padding: 12px 16px;
            }

            .input-area {
                padding: 12px 16px;
            }

            .message .bubble {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 顶部栏 -->
    <div class="header">
        <div class="logo">AI</div>
        <div>
            <div class="title">AI 金融助手</div>
            <div class="subtitle">Powered by DeepSeek</div>
        </div>
        <div class="status">
            <span class="dot"></span>
            在线
        </div>
    </div>

    <!-- 对话区域 -->
    <div class="chat-area" id="chatArea">
        <div class="welcome" id="welcome">
            <div class="icon">🤖</div>
            <h2>你好，我是 AI 金融助手</h2>
            <p>我可以帮你分析股票行情、解读财经新闻、解答投资疑问</p>
            <div class="suggestions">
                <div class="suggestion" onclick="sendSuggestion('今天A股市场表现如何？')">📈 今日行情</div>
                <div class="suggestion" onclick="sendSuggestion('请帮我分析一下新能源板块的投资前景')">🔋 板块分析</div>
                <div class="suggestion" onclick="sendSuggestion('什么是量化交易？')">📚 概念解释</div>
                <div class="suggestion" onclick="sendSuggestion('如何构建稳健的投资组合？')">💼 投资建议</div>
            </div>
        </div>
    </div>

    <!-- 输入区域 -->
    <div class="input-area">
        <textarea
                id="messageInput"
                rows="1"
                placeholder="输入你的问题，按 Enter 发送，Shift+Enter 换行"
                onkeydown="handleKeyDown(event)"
                oninput="autoResize(this)"
        ></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="发送">
            ➤
        </button>
    </div>
</div>

<script>
    const chatArea = document.getElementById('chatArea');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const welcome = document.getElementById('welcome');

    let isSending = false;

    // ==================== 发送消息 ====================

    function sendSuggestion(text) {
        messageInput.value = text;
        sendMessage();
    }

    async function sendMessage() {
        const message = messageInput.value.trim();
        if (!message || isSending) return;

        isSending = true;
        sendBtn.disabled = true;

        // 隐藏欢迎消息
        if (welcome) welcome.style.display = 'none';

        // 添加用户消息
        appendMessage('user', message);

        // 清空输入框
        messageInput.value = '';
        messageInput.style.height = 'auto';

        // 添加 AI 消息占位（先显示打字动画）
        const aiMsg = appendMessage('ai', '', true);
        const bubble = aiMsg.querySelector('.bubble');
        let fullText = '';

        try {
            const response = await fetch('/api/v1/chat/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
                body: JSON.stringify({ message: message })
            });

            if (!response.ok) {
                throw new Error(`请求失败 (${response.status})`);
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';
            let firstChunk = true;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop();

                for (const line of lines) {
                    if (!line.startsWith('data:')) continue;

                    const data = line.slice(5).trim();
                    if (!data) continue;

                    try {
                        const parsed = JSON.parse(data);
                        if (parsed.event === 'done') continue;
                        if (parsed.event === 'error') {
                            throw new Error(parsed.data || '模型调用失败');
                        }
                    } catch (e) {
                        // 非 JSON 格式的 data，直接当文本处理
                    }

                    if (data === '[DONE]') continue;

                    // 首次收到内容时，清除打字动画
                    if (firstChunk) {
                        bubble.innerHTML = '';
                        firstChunk = false;
                    }

                    fullText += data;
                    bubble.innerHTML = renderMarkdown(fullText);
                    scrollToBottom();
                }
            }

            // 流结束，如果没收到任何内容
            if (!fullText) {
                bubble.innerHTML = '<span style="color:#999;">（未收到回复）</span>';
            }

            // 补上时间戳
            const time = document.createElement('div');
            time.className = 'time';
            time.textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            aiMsg.appendChild(time);

        } catch (error) {
            bubble.innerHTML = '';
            bubble.style.color = '#ff4d4f';
            bubble.textContent = '抱歉，请求出错了：' + error.message;
            showError('发送失败，请检查网络连接后重试');
        } finally {
            isSending = false;
            sendBtn.disabled = false;
            messageInput.focus();
        }
    }

    // ==================== 添加消息 ====================

    function appendMessage(role, text, isTyping = false, isError = false) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}`;

        // 头像
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = role === 'user' ? '我' : 'AI';
        msgDiv.appendChild(avatar);

        // 气泡
        const bubble = document.createElement('div');
        bubble.className = 'bubble';

        if (isTyping) {
            bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
        } else if (isError) {
            bubble.style.color = '#ff4d4f';
            bubble.textContent = text;
        } else {
            // 简单 Markdown 渲染
            bubble.innerHTML = renderMarkdown(text);
        }
        msgDiv.appendChild(bubble);

        // 时间
        if (!isTyping) {
            const time = document.createElement('div');
            time.className = 'time';
            time.textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            msgDiv.appendChild(time);
        }

        chatArea.appendChild(msgDiv);
        scrollToBottom();
        return msgDiv;
    }

    // ==================== 简易 Markdown 渲染 ====================

    function renderMarkdown(text) {
        // 代码块 ```
        text = text.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
            return `<pre><code>${escapeHtml(code.trim())}</code></pre>`;
        });

        // 行内代码 `
        text = text.replace(/`([^`]+)`/g, '<code>$1</code>');

        // 粗体 **
        text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

        // 斜体 *
        text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');

        // 标题 ### 
        text = text.replace(/^### (.+)$/gm, '<h4>$1</h4>');
        text = text.replace(/^## (.+)$/gm, '<h3>$1</h3>');
        text = text.replace(/^# (.+)$/gm, '<h2>$1</h2>');

        // 无序列表
        text = text.replace(/^- (.+)$/gm, '<li>$1</li>');

        // 换行
        text = text.replace(/\n/g, '<br>');

        return text;
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // ==================== 辅助功能 ====================

    function handleKeyDown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    function autoResize(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
    }

    function scrollToBottom() {
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function showError(msg) {
        const toast = document.createElement('div');
        toast.className = 'error-toast';
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    // 页面加载完成，聚焦输入框
    messageInput.focus();
</script>

</body>
</html>
